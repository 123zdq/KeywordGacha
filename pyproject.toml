[project]
name = "keywordgacha"
version = "0.14.2"
description = "本地工作流特化版"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "beautifulsoup4>=4.13.5",
    "json-repair>=0.50.0",
    "lxml>=6.0.1",
    "openai>=1.101.0",
    "openpyxl>=3.1.5",
    "pecab>=1.0.8",
    "pykakasi>=2.3.0",
    "rich>=14.1.0",
    "sudachidict-core>=20250515",
    "sudachipy>=0.6.10",
    "tiktoken>=0.11.0",
    "transformers>=4.55.4",
]

[project.optional-dependencies]
cu129 = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
]
cpu = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cu129" },
    { extra = "cpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", extra = "cu129" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu129", extra = "cu129" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.12.11",
]

[tool.ruff]
line-length = 144  # 代码最大行宽
select = [         # 选择的规则
    "F",
    "E",
    "W",
    "UP",
    "I",
]
# ignore = ["F401"]  # 忽略的规则